name: Issue new release

on:
  push:
    tags:
      - 'v*'
    branches:
      - "!*"

jobs:
  release:
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os: [ 'ubuntu-24.04' ]
        go-version: [1.27.x]
    runs-on: ${{ matrix.os }}
    name: Release
    steps:
      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dependabot bumps goreleaser in tools/goreleaser/go.mod; CI follows it.
      - name: Get goreleaser version
        id: goreleaser
        run: |
          echo "version=$(awk '$1 == "github.com/goreleaser/goreleaser/v2" { print $2 }' tools/goreleaser/go.mod)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          install-only: true

      - name: Run GoReleaser
        if: success()
        run: |
          make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scripts run the goreleaser installed above instead of building it.
          GORELEASER_BIN: goreleaser
